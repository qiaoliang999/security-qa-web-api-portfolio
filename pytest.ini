# Security QA Lab — pytest configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    ui: optional Playwright UI tests
    security: security-focused cases (authn/authz/validation/exposure)
    authz: authorization / access control
    authn: authentication / session
    smoke: fast smoke checks
filterwarnings =
    ignore::DeprecationWarning
