name: security-qa-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run security QA test suite
        env:
          LAB_MODE: "true"
        run: pytest -q

      - name: Run secure-mode smoke (suite already dual-mode via fixtures)
        run: pytest -q tests/test_auth.py tests/test_authorization.py tests/test_input_validation.py
